name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run base project unit tests
        run: python -m unittest discover -s tests -v
      - name: Run setlist-admin-usb expansion tests
        run: python -m unittest discover -s expansions/setlist-admin-usb/tests -v
      - name: Run setlist-admin-wifi expansion tests
        run: python -m unittest discover -s expansions/setlist-admin-wifi/tests -v
